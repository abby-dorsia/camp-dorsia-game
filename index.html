<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Husein's Mad Dash</title>
<style>
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #0a120c;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #0a120c;
  }
  :root {
    --green-950: #14231a;
    --green-800: #24402e;
    --green-700: #2f5138;
    --cream: #f3ecdd;
    --cream-dim: #e4dcc8;
    --ember: #d97a3f;
    --ember-dark: #a85a2a;
    --gold: #c9a227;
    --bark: #6b5a45;
    --bark-light: #8a7860;
    --page-bg: #14231a;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--page-bg);
    color: var(--cream);
    margin: 0;
    min-height: 100vh;
    padding: 24px 14px 40px;
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }

  .display {
    font-family: 'Futura', 'Trebuchet MS', 'Arial Narrow', sans-serif;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .mono {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-variant-numeric: tabular-nums;
  }

  .rig {
    width: min(100%, 380px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .tag-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    width: 100%;
    padding: 0 6px;
  }

  .tag-row .display {
    font-size: 0.72rem;
    color: var(--cream-dim);
    letter-spacing: 0.18em;
  }

  .tag-row .crest {
    font-size: 0.72rem;
    color: var(--gold);
    letter-spacing: 0.18em;
  }

  .frame {
    position: relative;
    width: 100%;
    background: var(--cream);
    border: 2px dashed var(--bark-light);
    border-radius: 6px;
    padding: 12px;
    box-shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
  }

  .screen-wrap {
    position: relative;
    width: 100%;
    border-radius: 3px;
    overflow: hidden;
    background: #000;
    line-height: 0;
  }

  canvas#game {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  .rivet {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bark-light);
    opacity: 0.55;
  }
  .rivet.tl { top: 6px; left: 6px; }
  .rivet.tr { top: 6px; right: 6px; }
  .rivet.bl { bottom: 6px; left: 6px; }
  .rivet.br { bottom: 6px; right: 6px; }

  .pad-module {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .dpad {
    position: relative;
    width: 128px;
    height: 128px;
    flex-shrink: 0;
  }

  .dbtn {
    position: absolute;
    width: 42px;
    height: 42px;
    background: var(--green-800);
    border: none;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cream);
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background 0.05s, transform 0.05s;
  }
  .dbtn:active, .dbtn.pressed {
    background: var(--ember);
    transform: scale(0.94);
  }
  .dbtn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .dbtn.up    { top: 0; left: 43px; }
  .dbtn.down  { bottom: 0; left: 43px; }
  .dbtn.left  { top: 43px; left: 0; }
  .dbtn.right { top: 43px; right: 0; }
  .dpad-hub {
    position: absolute;
    top: 43px; left: 43px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--bark-light);
    opacity: 0.35;
  }

  .placard {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
    text-align: right;
  }

  .placard .display {
    font-size: 0.62rem;
    color: var(--bark);
    letter-spacing: 0.14em;
  }

  .placard p {
    margin: 0;
    font-size: 0.78rem;
    color: var(--green-800);
    line-height: 1.35;
  }

  .footer-credit {
    width: 100%;
    text-align: center;
    font-size: 0.68rem;
    color: var(--bark-light);
    letter-spacing: 0.1em;
  }

  @media (min-width: 480px) {
    .rig { width: 380px; }
  }
</style>

<div class="rig">
  <div class="tag-row">
    <span class="display">Husein's Mad Dash</span>
    <span class="crest">Camp Dorsia &middot; Est. 2025</span>
  </div>

  <div class="frame">
    <span class="rivet tl"></span><span class="rivet tr"></span>
    <span class="rivet bl"></span><span class="rivet br"></span>
    <div class="screen-wrap">
      <canvas id="game" width="384" height="640"></canvas>
    </div>
  </div>

  <div class="pad-module">
    <div class="dpad">
      <button class="dbtn up" data-dir="up" aria-label="Move up">&#9650;</button>
      <button class="dbtn down" data-dir="down" aria-label="Move down">&#9660;</button>
      <button class="dbtn left" data-dir="left" aria-label="Move left">&#9664;</button>
      <button class="dbtn right" data-dir="right" aria-label="Move right">&#9654;</button>
      <div class="dpad-hub"></div>
    </div>
    <div class="placard">
      <span class="display">Trail Tag &#8470;07</span>
      <p>Husein is late for dinner.<br>Will he make it in time?</p>
    </div>
  </div>

  <div class="footer-credit mono">CAMP DORSIA &mdash; BERKSHIRES 2026</div>
</div>

  var EMPTY_SEAT = { x: RIGHT_INNER_X, y: BANQUET.seatYStart + BANQUET.seatSpacing * EMPTY_ROW };

  var CROWD = [];
  (function buildCrowd() {
    // Each column belongs to one table; facing points toward that table's own
    // centerline (not "toward the aisle") so plates always land on that table's
    // linen instead of sometimes landing off the far edge of the wrong table.
    var cols = [
      { x: BANQUET.tableLeftX - BANQUET.seatInset, table: BANQUET.tableLeftX },
      { x: BANQUET.tableLeftX + BANQUET.seatInset, table: BANQUET.tableLeftX },
      { x: BANQUET.tableRightX - BANQUET.seatInset, table: BANQUET.tableRightX },
      { x: BANQUET.tableRightX + BANQUET.seatInset, table: BANQUET.tableRightX }
    ];
    var vi = 0;
    for (var row = 0; row < BANQUET.seatRows; row++) {
      var y = BANQUET.seatYStart + row * BANQUET.seatSpacing;
      cols.forEach(function (col) {
        var cx = col.x;
        if (cx === RIGHT_INNER_X && (row === ABBY_ROW || row === EMPTY_ROW)) return;
        var v = CROWD_VARIANTS[vi % CROWD_VARIANTS.length]; vi++;
        var facing = cx < col.table ? 1 : -1; // face inward, toward own table's centerline
        CROWD.push({ x: cx, y: y, hair: v.hair, shirt: v.shirt, facing: facing });
      });
    }
  })();

  var TREES = [];

    for (var wy = -30; wy < WORLD_H + 30; wy += 62) {

  // ---------- pixel drawing helpers ----------
  function r(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

  // A real pixel-art "circle" is a hand-stepped staircase of square rows, not a smooth
  // vector curve — this is what every circ() call in the game now draws instead of ctx.arc().
  function circ(cx, cy, radius, c) {
    ctx.fillStyle = c;
    var r0 = Math.round(radius);
    for (var dy = -r0; dy <= r0; dy++) {
      var dx = Math.floor(Math.sqrt(Math.max(0, radius * radius - dy * dy)) + 0.2);
      ctx.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1);
    }
  }

  // Same idea for soft shadows/glows that used to be smooth ctx.ellipse() fills.
  function pixEllipse(cx, cy, rx, ry, c) {
    ctx.fillStyle = c;
    var ry0 = Math.round(ry);
    for (var dy = -ry0; dy <= ry0; dy++) {
      var t = 1 - (dy * dy) / (ry * ry);
      if (t < 0) continue;
      var dx = Math.floor(rx * Math.sqrt(t) + 0.2);
      ctx.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1);
    }
  }

  // Checkerboard dither — the hand-pixel-art way to fake a soft tone between two flat colors.
  function dither(x, y, w, h, colorA, colorB) {
    for (var dy = 0; dy < h; dy++) {
      for (var dx = 0; dx < w; dx++) {
        ctx.fillStyle = ((Math.round(x) + dx + Math.round(y) + dy) % 2 === 0) ? colorA : colorB;
        ctx.fillRect(Math.round(x) + dx, Math.round(y) + dy, 1, 1);
      }
    }
  }

  // Floating reaction text over a character (e.g. Nate's "Pookie!" when you run past
  // him without the gummy) — not a persistent nameplate, characters aren't labeled.
  function drawLabel(text, cx, topY) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(text, cx, topY + 1);
    ctx.fillStyle = PAL.cream;
    ctx.fillText(text, cx, topY);
    ctx.restore();
  }

  function drawHusein(x, y, moving, animT, facing) {
    var bob = moving ? (Math.sin(animT * 10) > 0 ? 1 : 0) : 0;
    var legOffset = moving ? Math.round(Math.sin(animT * 10) * 3) : 0;
    var by = y - bob;
    // legs + shoes
    r(x + 4, by + 26, 6, 12 + legOffset, PAL.skin);
    r(x + 16, by + 26, 6, 12 - legOffset, PAL.skinShadow);
    r(x + 3, by + 36 + legOffset, 8, 5, PAL.shoe);
    r(x + 15, by + 36 - legOffset, 8, 5, PAL.shoe);
    r(x + 3, by + 40 + legOffset, 8, 1, PAL.shoeSole);
    r(x + 15, by + 40 - legOffset, 8, 1, PAL.shoeSole);
    // shorts
    r(x + 2, by + 18, 22, 10, PAL.shorts);
    r(x + 2, by + 18, 22, 2, PAL.shortsLight);
    // shirt with satin sheen + collar + buttons
    r(x + 2, by + 4, 22, 15, PAL.shirt);
    r(x + 2, by + 4, 22, 2, PAL.shirtDark);
    r(x + 16, by + 6, 5, 12, PAL.shirtLight);
    ctx.fillStyle = PAL.shirtDark;
    ctx.beginPath(); ctx.moveTo(x + 10, by + 4); ctx.lineTo(x + 13, by + 9); ctx.lineTo(x + 16, by + 4); ctx.fill();
    r(x + 12, by + 12, 2, 2, PAL.button);
    r(x + 12, by + 16, 2, 2, PAL.button);
    // arms
    r(x - 2, by + 5, 4, 15, PAL.skin);
    r(x + 24, by + 5, 4, 15, PAL.skinShadow);
    // neck + necklace
    r(x + 9, by + 1, 8, 4, PAL.skin);
    r(x + 9, by + 4, 8, 1, PAL.gold);
    circ(x + 13, by + 6, 1.6, PAL.gold);
    // head
    r(x + 5, by - 14, 16, 16, PAL.skin);
    dither(x + 5, by - 3, 16, 2, PAL.skin, PAL.skinShadow);
    r(x + 5, by - 1, 16, 2, PAL.skinShadow);
    r(x + 12, by - 7, 1, 4, PAL.skinShadow);
    // eyebrows + eyes + mouth — sized to actually read at real gameplay scale, not just
    // technically present (a 3x1 brow / 1x1 catchlight turned out invisible in motion)
    var flip = facing < 0;
    var eb1 = flip ? x + 15 : x + 8, eb2 = flip ? x + 9 : x + 16;
    r(eb1, by - 7, 4, 2, PAL.browDark);
    r(eb2, by - 7, 4, 2, PAL.browDark);
    var ee1 = flip ? x + 16 : x + 9, ee2 = flip ? x + 10 : x + 15;
    r(ee1, by - 4, 2, 2, PAL.hair);
    r(ee2, by - 4, 2, 2, PAL.hair);
    r(ee1, by - 4, 2, 1, PAL.cream);
    r(ee2, by - 4, 2, 1, PAL.cream);
    r(x + 10, by, 6, 1, PAL.mouth);
    // hair: curly silhouette with highlight
    r(x + 3, by - 18, 20, 6, PAL.hair);
    r(x + 3, by - 14, 4, 6, PAL.hair);
    r(x + 19, by - 14, 4, 6, PAL.hair);
    circ(x + 6, by - 19, 3, PAL.hair);
    circ(x + 12, by - 21, 3.4, PAL.hair);
    circ(x + 18, by - 19, 3, PAL.hair);
    circ(x + 22, by - 15, 2.6, PAL.hair);
    circ(x + 2, by - 15, 2.6, PAL.hair);
    r(x + 6, by - 20, 5, 2, PAL.hairHi);
  }

  function drawAlyssa(x, y, chasing, animT) {

  function drawNate(x, y, collected) {

  // Loose round stones (cast shadow + body + highlight) instead of flat scattered
  // squares, so the patch actually reads as gravel and not just a plain gray tint.
  // Seeded from the patch's fixed world position (not the scrolling screen y), so
  // the stones stay put as the camera scrolls instead of re-randomizing every frame.
  function drawGravel(patch, camY) {
    var sy = worldToScreen(patch.y, camY);
    r(patch.x, sy, patch.w, patch.h, PAL.gravelDark);
    var seed = patch.x * 4.7 + patch.y * 9.3;
    var count = Math.round((patch.w * patch.h) / 220);
    for (var i = 0; i < count; i++) {
      var fx = hash(seed + i * 12.37);
      var fy = hash(seed + i * 7.91 + 100);
      var fr = hash(seed + i * 3.13 + 200);
      var ft = hash(seed + i * 5.59 + 300);
      var sx = patch.x + fx * patch.w;
      var ssy = sy + fy * patch.h;
      var rad = 1.4 + fr * 2.6;
      var stoneColor = ft > 0.62 ? PAL.gravelLight : (ft > 0.28 ? PAL.gravel : PAL.gravelDark);
      circ(sx + rad * 0.4, ssy + rad * 0.5, rad * 0.85, 'rgba(0,0,0,0.22)');
      circ(sx, ssy, rad, stoneColor);
      if (ft > 0.5) circ(sx - rad * 0.35, ssy - rad * 0.35, Math.max(0.6, rad * 0.32), 'rgba(255,255,255,0.35)');
    }
  }

  function drawArcheryRange(camY) {
    var topEdge = worldToScreen(ZONES.archery.y0, camY);
    var botEdge = worldToScreen(ZONES.archery.y1, camY);
    r(0, topEdge, W, botEdge - topEdge, '#254a33');
    var ty = worldToScreen(2940, camY);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(22, ty + 20, 17, 5, 0, 0, Math.PI * 2); ctx.fill();
    r(8, ty - 26, 28, 52, '#5a4530');
    for (var gi = 0; gi < 52; gi += 5) r(8, ty - 26 + gi, 28, 1, '#4a3826');
    r(6, ty - 26, 32, 3, '#6e5540');
    r(13, ty - 4, 18, 10, PAL.woodDark);
    r(13, ty - 4, 18, 2, PAL.woodLight);
    circ(22, ty - 10, 18, PAL.targetRing);
    circ(22, ty - 10, 13, PAL.target);
    circ(22, ty - 10, 8, PAL.targetRing);
    circ(22, ty - 10, 3.5, PAL.target);
    circ(15, ty - 17, 2, 'rgba(255,255,255,0.4)');
    // a couple of stray arrows already stuck in the target
    r(-4, ty - 16, 14, 3, PAL.arrow);
    r(-7, ty - 16, 4, 5, PAL.arrowHead);
    r(0, ty - 2, 12, 3, PAL.arrow);
    r(-4, ty - 2, 4, 5, PAL.arrowHead);
  }

  function drawArrow(x, y, flying) {
    if (!flying) return;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(x - 2, y + 6, 26, 3);
    // fletching
    ctx.fillStyle = PAL.fletch;
    ctx.beginPath(); ctx.moveTo(x + 1, y); ctx.lineTo(x - 7, y - 5); ctx.lineTo(x + 1, y - 1); ctx.fill();
    ctx.fillStyle = PAL.fletchDark;
    ctx.beginPath(); ctx.moveTo(x + 1, y + 3); ctx.lineTo(x - 7, y + 7); ctx.lineTo(x + 1, y + 4); ctx.fill();
    // shaft (two-tone) + head
    r(x, y, 20, 3, PAL.arrow);
    r(x, y, 20, 1, '#eee3ca');
    r(x + 16, y - 2, 7, 7, PAL.arrowHead);
    r(x + 19, y - 2, 4, 7, PAL.arrowMetal);
  }

  function drawSunglasses(sg, camY) {
    if (sg.taken) return;
    var sy = worldToScreen(sg.y, camY);
    r(sg.x, sy, 20, 3, '#1a1a1a');
    circ(sg.x + 5, sy + 1, 5, '#1a1a1a');
    circ(sg.x + 15, sy + 1, 5, '#1a1a1a');

  function drawSprinkler(s, sx, sy, on, sprayPhase) {
    r(sx - 3, sy, 6, 12, PAL.sprinklerBody);
    r(sx - 3, sy, 6, 3, '#9aa89a');
    if (on) {
      ctx.fillStyle = PAL.spray;
      for (var a = 0; a < 12; a++) {
        var ang = (a / 12) * Math.PI * 2 + sprayPhase;
        var dx = Math.cos(ang) * s.radius, dy = Math.sin(ang) * s.radius * 0.6;
        ctx.fillRect(Math.round(sx + dx - 2), Math.round(sy + dy - 2), 3, 3);
      }
      ctx.fillStyle = 'rgba(140,190,220,0.18)';
      ctx.beginPath();
      ctx.ellipse(sx, sy, s.radius, s.radius * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSeated(x, y, hair, shirt, facing) {

    ctx.beginPath(); ctx.moveTo(x - 1, y - 16); ctx.lineTo(x, y - 13); ctx.lineTo(x + 1, y - 16); ctx.fill();
    r(x - 1, y - 9, 2, 2, 'rgba(0,0,0,0.2)');
    r(x - 6, y - 8, 4, 5, PAL.fairSkin);
    r(x + 2, y - 8, 4, 5, PAL.fairSkin);
    r(x - 5, y - 30, 10, 14, PAL.fairSkin);
    r(x - 5, y - 30, 10, 2, 'rgba(0,0,0,0.12)');
    r(x - 5, y - 34, 10, 6, hair);
    var eOff = facing < 0 ? -2 : 2;
    r(x - 2 + eOff, y - 27, 2, 2, hair);
    r(x + eOff, y - 27, 2, 2, hair);
    r(x - 2 + eOff, y - 25, 2, 2, '#2b1d14');

      r(0, sy, W, 1, PAL.roomFloorDark);

      r(0, sy, W, 2, PAL.stoneSeam);

        var py = sy + Math.floor(hash(wy * 4.4 + j * 5.1) * bandH);

        r(qx, qy, 4, 4, hash(wy + k) > 0.5 ? PAL.pathLight : PAL.pathDark);

  var clock = 0;

  function update(dt) {
    clock += dt;
    if (state === STATE.INTRO) {
      introTimer += dt;
      if (introTimer > 1.9) { introTimer = 0; introIdx++; if (introIdx >= introLines.length) state = STATE.PLAY; }
      return;
    }
    if (state !== STATE.PLAY) return;

    var g = game, p = g.player;
    g.time -= dt;
    if (g.time <= 0) { g.time = 0; state = STATE.LATE; return; }

    // movement
    var dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    var dy = (input.up ? 1 : 0) - (input.down ? 1 : 0);
    p.moving = dx !== 0 || dy !== 0;
    if (dx !== 0) p.facing = dx;
    if (p.moving) p.animT += dt;

    var baseSpeed = 85;
    if (p.soakTimer > 0) p.soakTimer -= dt;
    if (p.boostTimer > 0) p.boostTimer -= dt;
    var soakMul = p.soakTimer > 0 ? 0.6 : 1;
    var boostMul = p.boostTimer > 0 ? 1.6 : 1;

    var inGravel = GRAVEL_PATCHES.some(function (pt) {
      return p.x + p.w > pt.x && p.x < pt.x + pt.w && p.y > pt.y && p.y < pt.y + pt.h;
    });
    var speedMul = soakMul * boostMul * (inGravel ? 0.68 : 1);

    // gravel slows you down on contact, but too much cumulative time on it across the
    // driveway breaks a heel — the timer only resets once you clear the whole zone,
    // not each individual patch, so hopping the gaps doesn't reset your risk.
    if (inGravel) {
      p.gravelTimer += dt;
      if (p.gravelTimer > 5) { state = STATE.HEEL; return; }
    } else if (!(p.y >= ZONES.gravel.y0 && p.y < ZONES.gravel.y1)) {
      p.gravelTimer = 0;
    }

    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    p.x += (dx / len) * baseSpeed * speedMul * dt;
    // pressing "up" moves toward the banquet (world y decreases toward the finish at y=0)
    p.y -= (dy / len) * baseSpeed * speedMul * dt;
    p.x = Math.max(LANE_L, Math.min(LANE_R - p.w, p.x));
    p.y = Math.max(40, Math.min(WORLD_H - 60, p.y));

    // the banquet tables are solid — stay in the aisle between them, except at the
    // empty seat's own row, where a pocket opens up so you can actually pull into it.
    // SEAT_POCKET_Y_HALF is deliberately wider than SEAT_WIN_TOL (below) so the pocket
    // is fully open well before you're close enough to win, and the reachable x lands
    // comfortably inside the win tolerance rather than right on its edge — on a touch
    // d-pad you usually can't hold two directions at once, so this needs real slack,
    // not a razor-thin window, or lining up feels like it "won't let you in."
    if (p.y > BANQUET.tableY0 && p.y < BANQUET.tableY1) {
      var aisleL = BANQUET.tableLeftX + BANQUET.tableHalfW + 6;
      var aisleR = BANQUET.tableRightX - BANQUET.tableHalfW - 6 - p.w;
      var SEAT_POCKET_Y_HALF = 26;
      if (Math.abs(p.y - EMPTY_SEAT.y) < SEAT_POCKET_Y_HALF) {
        aisleR = Math.max(aisleR, EMPTY_SEAT.x + 10 - p.w / 2);
      }
      p.x = Math.max(aisleL, Math.min(aisleR, p.x));
    }

    // camera follows player; camY is the world-y at the top of the screen
    g.camY = Math.max(0, Math.min(WORLD_H - H, p.y - H * 0.6));

    if (g.flashT > 0) g.flashT -= dt;

    // sunglasses pickup
    if (!g.sunglasses) {
      var sgWorldY = SUNGLASSES.y;
      if (Math.abs(p.y - sgWorldY) < 24 && Math.abs(p.x - SUNGLASSES.x) < 24) {
        g.sunglasses = true;
        g.flashMsg = 'SUNGLASSES +STYLE'; g.flashT = 1.4;
      }
    }

    // Alyssa AI (active while player is within her zone)
    var a = g.alyssa;
    if (p.y > ZONES.alyssa.y0 - 120 && p.y < ZONES.alyssa.y1 + 120) {
      var alyssaWorldY = (ZONES.alyssa.y0 + ZONES.alyssa.y1) / 2;
      var dPlayer = Math.hypot(p.x - a.x, p.y - alyssaWorldY);
      if (dPlayer < 110) { a.noticed = true; }
      if (a.noticed) {
        var chDx = p.x - a.x;
        a.x += Math.sign(chDx) * 62 * dt;
      } else {
        a.x += a.vx * dt;
        if (a.x < LANE_L + 20 || a.x > LANE_R - 40) a.vx *= -1;
      }
      a.x = Math.max(LANE_L, Math.min(LANE_R - 26, a.x));
      if (Math.abs(p.x - a.x) < 22 && Math.abs(p.y - alyssaWorldY) < 28) {
        state = STATE.BUSTED;
      }
    } else {
      a.noticed = false;
    }

    // Nate patrols back and forth around his spot
    var nt = g.nate;
    nt.x += nt.vx * dt;
    if (nt.x < NATE.x - NATE_PATROL_RANGE || nt.x > NATE.x + NATE_PATROL_RANGE) nt.vx *= -1;
    nt.x = Math.max(NATE.x - NATE_PATROL_RANGE, Math.min(NATE.x + NATE_PATROL_RANGE, nt.x));

    // Nate pickup — grants a temporary speed boost
    if (!g.gummiesTaken && p.y > NATE.y - 80 && p.y < NATE.y + 80) {
      if (Math.abs(p.x - nt.x) < 26 && Math.abs(p.y - NATE.y) < 28) {
        g.gummiesTaken = true;
        p.boostTimer = 5;
        g.bottomMsg = 'Gummy Speed Boost!'; g.bottomMsgT = 2.6;
      }
    }
    // ran past Nate's spot without grabbing it — he notices
    if (!g.gummiesTaken && !g.natePookieShown && p.y < NATE.y - 80) {
      g.natePookieShown = true;
    }

    // Abby's saved seat — shown at the bottom, same as the obstacle callouts,
    // instead of the top flash message
    if (!g.abbyGreeted && Math.abs(p.y - BANQUET.abby.y) < 20) {
      g.abbyGreeted = true;
      g.bottomMsg = 'Find your seat!'; g.bottomMsgT = 2.6;
    }

    // sprinklers — brief exposure just slows you (soakTimer), but lingering in the
    // sprinklers zone getting doused for a cumulative 3+ seconds ruins the outfit for
    // good. Exposure only resets once you clear the whole zone (not each time a given
    // sprinkler's own on/off cycle happens to flip off), since any single sprinkler's
    // "on" phase alone (<= its period) never reaches 3s — it takes lingering through
    // more than one dousing to hit the threshold.
    var underSpray = false;
    g.sprinklers.forEach(function (s, i) {
      s.timer += dt;
      var period = SPRINKLERS[i].period;
      if (s.timer > period) { s.timer = 0; s.on = !s.on; }
      if (s.on) {
        var sx = SPRINKLERS[i].x, sy = SPRINKLERS[i].baseY;
        if (Math.abs(p.x - sx) < SPRINKLERS[i].radius * 0.7 && Math.abs(p.y - sy) < SPRINKLERS[i].radius * 0.7) {
          if (p.soakTimer <= 0) { g.flashMsg = 'SOAKED!'; g.flashT = 1.2; }
          p.soakTimer = 2.5;
          underSpray = true;
        }
      }
    });
    if (underSpray) {
      p.sprayExposure += dt;
      if (p.sprayExposure > 3) { state = STATE.SOAKED; return; }
    } else if (!(p.y >= ZONES.sprinklers.y0 && p.y < ZONES.sprinklers.y1)) {
      p.sprayExposure = 0;
    }

    // arrows in archery range — fewer arrows with real gaps between them, but getting
    // hit actually costs you: a big time penalty, a shove backward, and a screen flash.
    if (!g.arrows) {
      g.arrows = [];
      var ARROWS_PER_LANE = 2;
      ARCHERY_LANES.forEach(function (ly, i) {
        var speed = 150 + i * 14;
        var full = (W + 80) / speed;
        var dir = i % 2 === 0 ? 1 : -1;
        var startPhase = hash(ly * 3.7) * full;
        for (var k = 0; k < ARROWS_PER_LANE; k++) {
          g.arrows.push({ y: ly, dir: dir, speed: speed, full: full, phase: startPhase + full * (k / ARROWS_PER_LANE) });
        }
      });
    }
    if (p.arrowCooldown > 0) p.arrowCooldown -= dt;
    if (g.hitFlash > 0) g.hitFlash -= dt;
    g.arrows.forEach(function (arw) {
      arw.phase += dt;
      var t = arw.phase % arw.full;
      arw.flying = true;
      arw.x = arw.dir > 0 ? -40 + t * arw.speed : (W + 40) - t * arw.speed;
      if (p.arrowCooldown <= 0 && Math.abs(p.y - arw.y) < 16 && p.x + p.w > arw.x && p.x < arw.x + 22) {
        p.arrowHits += 1;
        if (p.arrowHits > 1) { state = STATE.SHOT; return; }
        g.time -= 6;
        p.y += 70;
        p.arrowCooldown = 1.6;
        g.hitFlash = 0.35;
        g.flashMsg = 'HIT BY AN ARROW -6s'; g.flashT = 1.4;
      }
    });
    if (state !== STATE.PLAY) return;

    // win condition: actually pulled into the empty seat Abby saved him, not just
    // level with its row — has to reach it in x too, since the aisle no longer
    // funnels you past it without stepping into the pocket
    var SEAT_WIN_TOL = 22;
    if (Math.abs(p.y - EMPTY_SEAT.y) < SEAT_WIN_TOL && Math.abs((p.x + p.w / 2) - EMPTY_SEAT.x) < SEAT_WIN_TOL) {
      state = STATE.WIN;
    }

    // obstacle callouts — one-shot copy at the bottom of the screen, first time you
    // reach each zone, in the same order the zones appear start-to-finish
    var zone = zoneForY(p.y);
    if (zone && !g.seenZoneMsg[zone]) {
      g.seenZoneMsg[zone] = true;
      g.bottomMsg = ZONE_INTRO_MSG[zone];
      g.bottomMsgT = 2.6;
    }
    if (g.bottomMsgT > 0) g.bottomMsgT -= dt;
  }

  // ---------- render ----------
  function renderTitle() {
    r(0, 0, W, H, '#1c3527');
    var cx = W / 2, cy = H / 2 - 60;
    // Real Camp Dorsia badge artwork, embedded as-is (see LOGO above) instead of a
    // hand-drawn replication — chroma-keyed so it sits flush on this exact bg color.
    if (LOGO.loaded) {
      var s = 248;
      ctx.drawImage(LOGO.img, cx - s / 2, cy - s / 2, s, s);
    }
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = PAL.ember;
    ctx.fillText("HUSEIN'S MAD DASH", cx, cy + 160);
    if (Math.floor(clock * 2) % 2 === 0) {
      ctx.fillStyle = PAL.cream;
      ctx.font = '14px monospace';
      ctx.fillText('TAP TO START', cx, H - 48);
    }
  }

  function renderIntro() {
    r(0, 0, W, H, '#101c14');
    ctx.fillStyle = PAL.cream;
    ctx.textAlign = 'center';
    ctx.font = '16px monospace';
    var line = introLines[Math.min(introIdx, introLines.length - 1)];
    wrapText(line, W / 2, H / 2, W - 60, 24);
  }

  function wrapText(text, cx, cy, maxWidth, lineHeight) {
    var words = text.split(' ');
    var lines = [], cur = '';
    words.forEach(function (w) {
      var test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth) { lines.push(cur); cur = w; } else { cur = test; }
    });
    lines.push(cur);
    var startY = cy - (lines.length - 1) * lineHeight / 2;
    lines.forEach(function (l, i) { ctx.fillText(l, cx, startY + i * lineHeight); });
  }

  function renderPlay() {
    var g = game, p = g.player, camY = g.camY;

    // background bands
    var bandH = 40;
    for (var wy = 0; wy < WORLD_H; wy += bandH) {
      var sy = worldToScreen(wy, camY);
      if (sy > H || sy + bandH < 0) continue;
      var baseColor = bgColorForWorldY(wy);
      r(0, sy, W, bandH + 1, baseColor);
      drawGroundTexture(wy, sy, bandH, baseColor);
    }

    // Husein's hotel room (the start)
    r(ROOM.rug.x - 30, worldToScreen(ROOM.rug.y + 40, camY), 60, 90, PAL.roomRug);
    r(ROOM.rug.x - 30, worldToScreen(ROOM.rug.y + 40, camY), 60, 4, PAL.roomRugDark);
    r(ROOM.rug.x - 26, worldToScreen(ROOM.rug.y + 44, camY), 52, 82, PAL.roomRugDark);
    r(ROOM.rug.x - 22, worldToScreen(ROOM.rug.y + 48, camY), 44, 74, PAL.roomRug);
    drawBed(ROOM.bed1.x, worldToScreen(ROOM.bed1.y, camY));
    drawBed(ROOM.bed2.x, worldToScreen(ROOM.bed2.y, camY));
    drawSuitcase(ROOM.suitcase.x, worldToScreen(ROOM.suitcase.y, camY));
    ROOM.clothes.forEach(function (c) {
      drawClothesPile(c.x, worldToScreen(c.y, camY), c.c1, c.c2);
    });
    drawDoorway(worldToScreen(ROOM.doorwayY, camY));

    // gravel
    GRAVEL_PATCHES.forEach(function (patch) {
      drawGravel(patch, camY);
    });

    // archery range
    drawArcheryRange(camY);
    if (g.arrows) g.arrows.forEach(function (arw) { drawArrow(arw.x, worldToScreen(arw.y, camY), arw.flying); });
    drawSunglasses({ x: SUNGLASSES.x, y: SUNGLASSES.y, taken: g.sunglasses }, camY);

    // Nate
    var nateSY = worldToScreen(NATE.y, camY);
    drawNate(g.nate.x - 12, nateSY, g.gummiesTaken);
    if (g.natePookieShown && !g.gummiesTaken) drawLabel('Pookie!', g.nate.x, nateSY - 30);

    // Alyssa
    var alyssaSY = worldToScreen((ZONES.alyssa.y0 + ZONES.alyssa.y1) / 2, camY);
    drawAlyssa(g.alyssa.x - 12, alyssaSY, g.alyssa.noticed, clock);

    // sprinklers
    g.sprinklers.forEach(function (s, i) {
      drawSprinkler(SPRINKLERS[i], SPRINKLERS[i].x, worldToScreen(SPRINKLERS[i].baseY, camY), s.on, clock * 4);
    });

    // banquet patio (the finish)
    drawHotel(worldToScreen(20, camY));
    drawTable(BANQUET.tableLeftX, worldToScreen(BANQUET.tableY0, camY), worldToScreen(BANQUET.tableY1, camY), BANQUET.tableHalfW);
    drawTable(BANQUET.tableRightX, worldToScreen(BANQUET.tableY0, camY), worldToScreen(BANQUET.tableY1, camY), BANQUET.tableHalfW);
    CROWD.forEach(function (person) {
      drawSeated(person.x, worldToScreen(person.y, camY), person.hair, person.shirt, person.facing);
    });
    drawEmptySeat(EMPTY_SEAT.x, worldToScreen(EMPTY_SEAT.y, camY), clock);
    var abbySY = worldToScreen(BANQUET.abby.y, camY);
    drawAbbySeat(BANQUET.abby.x, abbySY, clock);
    drawFinishBanner(worldToScreen(BANQUET.finishBannerY, camY));
    var marcSY = worldToScreen(BANQUET.marcY, camY);
    drawMarc(BANQUET.marcX - 12, marcSY, clock);

    // player
    drawHusein(p.x - 12, worldToScreen(p.y, camY), p.moving, p.animT, p.facing);

    // tree-lined trail borders
    TREES.forEach(function (t) {
      var tsy = worldToScreen(t.y, camY);
      if (tsy < -28 || tsy > H + 28) return;
      var bx = t.side === 'left' ? LANE_L - 20 + t.off : LANE_R + 20 + t.off;
      drawTree(bx, tsy, t.scale);
    });
    r(0, 0, LANE_L - 28, H, 'rgba(10,18,12,0.35)');
    r(LANE_R + 28, 0, W - LANE_R - 28, H, 'rgba(10,18,12,0.35)');

    // HUD
    r(0, 0, W, 32, 'rgba(10,18,12,0.72)');
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = g.time < 15 ? PAL.ember : PAL.cream;
    ctx.fillText('TIME ' + Math.ceil(g.time) + 's', 12, 22);

    if (p.boostTimer > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 13px monospace';
      ctx.fillStyle = PAL.ember;
      ctx.fillText('SPEED BOOST', W / 2, 22);
    }

    if (g.hitFlash > 0) {
      r(0, 0, W, H, 'rgba(180,30,20,' + (g.hitFlash / 0.35 * 0.4).toFixed(2) + ')');
    }

    if (g.flashT > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = PAL.cream;
      ctx.globalAlpha = Math.min(1, g.flashT);
      ctx.fillText(g.flashMsg, W / 2, 58);
      ctx.globalAlpha = 1;
    }

    // bottom-of-screen obstacle callout, shown once per zone on first arrival
    if (g.bottomMsgT > 0) {
      var bAlpha = Math.min(1, g.bottomMsgT);
      ctx.globalAlpha = bAlpha;
      r(0, H - 56, W, 40, 'rgba(10,18,12,0.72)');
      ctx.fillStyle = PAL.cream;
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      wrapText(g.bottomMsg, W / 2, H - 36, W - 40, 18);
      ctx.globalAlpha = 1;
    }
  }

  function renderEnd(title, sub, color, tag) {
    r(0, 0, W, H, '#101c14');
    ctx.textAlign = 'center';
    if (tag) {
      ctx.fillStyle = PAL.ember;
      ctx.font = 'bold 14px monospace';
      ctx.fillText(tag, W / 2, H / 2 - 68);
    }
    ctx.fillStyle = color;
    ctx.font = 'bold 22px monospace';
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.fillStyle = PAL.cream;
    ctx.font = '14px monospace';
    wrapText(sub, W / 2, H / 2 + 8, W - 60, 22);
    ctx.font = '12px monospace';
    ctx.fillStyle = PAL.gold;
    ctx.fillText('TIME LEFT: ' + (game ? Math.ceil(game.time) : 0) + 's', W / 2, H / 2 + 100);
    if (Math.floor(clock * 2) % 2 === 0) {
      ctx.fillStyle = PAL.cream;
      ctx.font = '14px monospace';
      ctx.fillText('TAP TO PLAY AGAIN', W / 2, H - 48);
    }
  }

  function render() {
    if (state === STATE.TITLE) renderTitle();
    else if (state === STATE.INTRO) renderIntro();
    else if (state === STATE.PLAY) renderPlay();
    else if (state === STATE.WIN) renderEnd('YOU MADE IT', "Made it just in time! Let's eat.", PAL.gold, null);
    else if (state === STATE.BUSTED) renderEnd('BUSTED!', "Alyssa: “Where do you think you're going?”", PAL.ember, null);
    else if (state === STATE.LATE) renderEnd('CAUGHT!', 'Marc opens his speech with a joke about your outfit.', PAL.ember, null);
    else if (state === STATE.HEEL) renderEnd('GAME OVER', 'You broke a heel!', PAL.ember, null);
    else if (state === STATE.SHOT) renderEnd('GAME OVER', 'Someone call a medic.', PAL.ember, null);
    else if (state === STATE.SOAKED) renderEnd('GAME OVER', 'Back to the outfit drawing board.', PAL.ember, null);
  }

  // ---------- loop ----------
  var last = null;
  function frame(ts) {
    if (last == null) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
